[workspace]
resolver = "2"
members = ["core", "cli", "api", "supervisor", "voice"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
jod-core = { path = "core" }
# Dictation. A separate crate rather than a module in the CLI so that the
# console keeps building on a headless VPS — nothing here links an audio
# backend. → `voice/src/record.rs`
jod-voice-core = { path = "voice" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "fs",
  "sync",
  "time",
  "io-util",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# `bundled` compiles SQLite in, so a VPS needs no system libsqlite3, and the
# FTS5 recall index is always available rather than depending on the host build.
rusqlite = { version = "0.37", features = ["bundled"] }
# Process groups and signals — what replaced tmux as the way a run is
# supervised, killed, and checked for life.
libc = "0.2"
# Cron parsing. Chosen by measurement, not popularity: across the two DST
# transitions `cron` 0.17 fires a daily job *twice* on fall-back and reads `1-5`
# as Sun–Thu, and `saffron` has no timezone concept at all. croner is the only
# one that fires once across fall-back, runs at 03:00 rather than skipping the
# spring-forward day, and accepts `@daily`, seconds, `L`, `#` and `W`.
# → research/scheduling-2026/out/cron-dst.txt
croner = "3"
# The IANA database. A schedule stores a zone *name*, never a captured offset —
# an offset is only correct until the next transition.
chrono-tz = "0.10"

# A fleet of agents builds this workspace in parallel, one git worktree each, and
# a `target/` is per-worktree — so every default cargo pays for is paid for six
# times over. Measured on one worktree's 8.7 GB `target/debug`:
#
#   incremental   3.9 GB  (44% of the directory)
#   deps          4.2 GB  (69% of the largest object file was `.debug_*`)
#
# Both defaults are tuned for a human in an edit-rebuild loop, which is not what
# runs here. `cargo test` inherits this profile, so both settings reach the check
# that actually runs.
[profile.dev]
# Incremental state is a cache for the *next* build of the same tree. An agent
# builds a handful of times and the worktree is then deleted, so the cache is
# written, paid for, and thrown away without ever being read back.
incremental = false
# `line-tables-only` keeps the file and line in a panic backtrace — the part a
# failing test needs — and drops the type and variable DWARF that dominates the
# size. Full `debug = 2` is what a debugger needs to inspect variables; nothing
# unattended does that, and `cargo build --profile dev-debug` gets it back.
debug = "line-tables-only"

# The escape hatch, for when a human does want to step through the TUI in a
# debugger. Inherits everything above and puts the DWARF back.
[profile.dev-debug]
inherits = "dev"
debug = 2
incremental = true

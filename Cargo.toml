[workspace]
resolver = "2"
members = ["core", "cli", "api", "supervisor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
jod-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "fs",
  "sync",
  "time",
  "io-util",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# `bundled` compiles SQLite in, so a VPS needs no system libsqlite3, and the
# FTS5 recall index is always available rather than depending on the host build.
rusqlite = { version = "0.37", features = ["bundled"] }
# Process groups and signals — what replaced tmux as the way a run is
# supervised, killed, and checked for life.
libc = "0.2"

name: iOS build

# The one thing neither a Linux laptop nor the VPS can do.
#
# `apps/ios` is a Tauri shell, and producing an app bundle needs the iOS SDK,
# which ships only inside Xcode and therefore only on macOS. Everything else
# about the client is checked on Linux by `apps/ios/tests/test.sh` (unit) and
# `apps/ios/e2e/run.mjs` (WebKit, the engine WKWebView uses); this workflow
# covers the remainder: that the Rust shell **compiles and links for iOS**, and
# that the resulting app **launches in a simulator**.
#
# Scoped to `apps/ios/**` so a docs or core change never pays for a macOS
# runner, and exposed via workflow_dispatch/workflow_call so it can be demanded
# or chained.
#
# Simulator only, and deliberately unsigned: a device build needs an Apple
# developer certificate this repo does not hold, and CODE_SIGNING_ALLOWED=NO is
# the honest way to build without inventing one.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add the iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Show the toolchain actually in use
        run: |
          rustc -V
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The check that fails on Linux for want of the SDK. On macOS it is the
      # real thing: the whole iOS dependency tree, compiled for the device
      # target, including the Objective-C shim that needs `xcrun`.
      - name: Compile the shell for iOS (device target)
        working-directory: apps/ios/src-tauri
        run: cargo check --target aarch64-apple-ios --verbose

      - name: Build the frontend
        run: npm run build

      - name: Generate the Xcode project
        run: npx tauri ios init --ci

      # Tauri emits a plain `.xcodeproj` plus a Podfile; a `.xcworkspace` only
      # appears once `pod install` has run. Install pods when the Podfile
      # actually declares any, then prefer whichever container exists rather
      # than assuming one.
      - name: Install pods, if there are any
        run: |
          set -euxo pipefail
          cd src-tauri/gen/apple
          ls -la
          if [ -f Podfile ] && grep -qE '^\s*pod ' Podfile; then
            pod install
          else
            echo "no pods declared — building the xcodeproj directly"
          fi

      - name: Build the app for the simulator
        # Driven through `tauri ios build`, not `xcodebuild` directly, and that
        # is not a stylistic choice. The generated project's "Build Rust Code"
        # phase shells back out to `tauri ios xcode-script`, which reads a state
        # file the *parent* Tauri command writes. Invoking xcodebuild on its own
        # skips the parent, so the script phase panics with
        # "failed to read missing addr file …-server-addr" — in debug *and*
        # release. The CLI owns this handshake; let it.
        #
        # `--target aarch64-sim` keeps it unsigned and simulator-bound: a device
        # build needs an Apple developer certificate this repo does not hold.
        run: npx tauri ios build --target aarch64-sim -v

      - name: Boot a simulator, install the app, and launch it
        run: |
          set -euxo pipefail
          # Tauri puts the simulator bundle under gen/apple's own build dir;
          # search broadly rather than pinning a layout that moves between CLI
          # versions.
          find src-tauri/gen/apple -name '*.app' -maxdepth 6 -print || true
          app=$(find src-tauri/gen/apple -name '*.app' -maxdepth 6 | head -1)
          test -n "$app"
          echo "built: $app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          echo "bundle id: $bundle_id"

          # Whatever iPhone this Xcode actually ships, rather than a hard-coded
          # model that disappears with the next image bump.
          device_type=$(xcrun simctl list devicetypes -j \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const t=JSON.parse(s).devicetypes.filter(d=>/iPhone/.test(d.name));console.log(t[t.length-1].identifier)})")
          echo "device type: $device_type"

          device=$(xcrun simctl create jod-ci "$device_type")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" "$bundle_id"

          # Let the webview load its assets before judging it.
          sleep 25
          xcrun simctl io "$device" screenshot simulator.png

          # Still resident is the evidence it did not crash on launch: an app
          # that fell over is gone from the device's process list by now.
          if xcrun simctl spawn "$device" launchctl list | grep -q "$bundle_id"; then
            echo "PASS: the app is running in the simulator"
          else
            echo "FAIL: the app is not running — it launched and then exited"
            xcrun simctl diagnose -b -X --no-archive --output=. || true
            exit 1
          fi

      - name: Upload the simulator screenshot and the app bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: |
            apps/ios/simulator.png
            apps/ios/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn

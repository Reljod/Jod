name: Release

# Everything that turns a commit into something a person can install, in one
# place. Two halves, and the split is the point.
#
#   1. PREPARE — automatic. Creating a `release/vX.Y.Z` branch runs the tests,
#      resolves the version, stamps it into the manifests, and opens the release
#      PR. Nothing here is visible outside the repo and nothing is irreversible:
#      delete the branch and it never happened.
#
#   2. PUBLISH — manual. Tagging, cutting a GitHub release, and building the
#      three clients onto it is what `install.sh` and `jod update` actually
#      serve to users, so it happens when a human runs the workflow, never as a
#      side effect of a push. It runs in the `release` environment, so adding a
#      required reviewer there adds an approval step without touching this file.
#
# The clients used to live in a second workflow, dispatched separately against
# the tag this one had just created. That meant two resolvers disagreeing about
# what `v0.2.0` meant was a possible state, two runs of the same suite, and a
# release that sat on the tag with no binaries until somebody remembered the
# second button. Now the tag and the artifacts are one act:
#
#   Jod TUI      jod, jod-run, jod-api — one tarball per platform, plus a
#                SHA256 next to it. What `install.sh` compiles from source; this
#                is the same thing prebuilt, for a box with no Rust toolchain.
#   Jod Desktop  the Tauri shell. A universal .dmg for macOS (Apple Silicon and
#                Intel in one file), .deb and .AppImage for Linux.
#   Jod iOS      simulator only, and unsigned — a device build needs an Apple
#                developer certificate this repo does not hold, and inventing
#                one is not on the table. The build itself is `ios.yml`, called
#                rather than copied.
#
# Everything is built from the *tag* this run creates, never from whatever
# `main` happens to be when you press the button — otherwise `jod --version`
# would lie. `build_only` is the exception and says so: it publishes nothing, so
# there is no tag to be faithful to and it builds the dispatched ref.
#
# Nothing here is code-signed or notarised. That is stated plainly in the README
# next to the install steps, with the one command each OS needs to accept an
# unsigned build, rather than papered over.
#
# Semantic Versioning (semver.org): tags are vMAJOR.MINOR.PATCH. The branch name
# decides the version; the one exception is a branch naming a version that has
# already shipped, which is patch-bumped rather than left to fail at `git tag`
# after the whole suite has run. `jod update` only ever moves within the
# installed MAJOR.MINOR, so a minor or major bump never yanks the rug out from
# under an existing install.
# → .github/scripts/release_version.sh, tests/release-version.test.sh

on:
  # Fires when any branch or tag is created; the jobs filter to `release/*`
  # branches. The `create` event carries no ref filter of its own.
  create:

  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.2.0 (blank: read it from the release branch, or bump the latest tag)"
        required: false
        type: string
      bump:
        description: "Part to bump when no version is given and the ref is not a release branch"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      build_only:
        description: "Build the clients and publish nothing — no tag, no release. Artifacts stay on the run."
        required: false
        type: boolean
        default: false
      tui:
        description: "Build Jod TUI (jod, jod-run, jod-api)"
        required: false
        type: boolean
        default: true
      desktop:
        description: "Build Jod Desktop (.dmg, .deb, .AppImage)"
        required: false
        type: boolean
        default: true
      ios:
        description: "Build Jod iOS (unsigned, simulator only)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One release at a time per ref. Two publishes racing would resolve the same
  # version from the same tag list, one would lose at `git push`, and both would
  # race each other on `gh release upload`.
  group: release-${{ github.event.ref || github.ref }}
  cancel-in-progress: false

jobs:
  # The same gate every PR passes. A build-only run pays for it too: a button
  # that ships a broken binary because nobody re-read the suite is worse than a
  # button that takes a minute longer.
  #
  # Every other `create` event — a plain feature branch, the tag this workflow
  # pushes itself — is none of this workflow's business.
  test:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.ref_type == 'branch'
          && startsWith(github.event.ref, 'release/'))
    uses: ./.github/workflows/tests.yml

  # Expensive, exploratory scaffold-fitness check — worth the cost when
  # something is actually shipping, not on every branch cut and not on a
  # build-only run that publishes nothing.
  e2e:
    if: github.event_name == 'workflow_dispatch' && !inputs.build_only
    uses: ./.github/workflows/e2e.yml

  # ---------------------------------------------------------------- prepare --
  prepare:
    name: Prepare release branch
    if: >-
      github.event_name == 'create'
      && github.event.ref_type == 'branch'
      && startsWith(github.event.ref, 'release/')
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref }}
          fetch-depth: 0

      - name: Resolve the version
        id: version
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          source .github/scripts/release_version.sh

          requested="$(branch_version "$BRANCH")" || {
            echo "::error::branch '$BRANCH' is not release/vMAJOR.MINOR.PATCH — nothing to release"
            exit 1
          }

          # Assigned, not read from a process substitution: a `read < <(…)`
          # would report success even when the resolver refused, and the refusal
          # is the whole reason this step exists.
          resolved="$(git tag --list 'v*' | resolve_release_version "$requested" patch)" || {
            echo "::error::cannot cut $requested from '$BRANCH' — see the refusal above"
            exit 1
          }
          read -r next reason <<<"$resolved"
          latest="$(git tag --list 'v*' | highest_semver_tag)"

          {
            echo "next=$next"
            echo "reason=$reason"
            echo "previous=${latest:-}"
            echo "requested=$requested"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the manifests
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: .github/scripts/stamp_version.sh "$NEXT"

      - name: Commit and push the bump
        env:
          NEXT: ${{ steps.version.outputs.next }}
          BRANCH: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            # Re-run on an already-stamped branch, or one cut by hand with the
            # bump already in it. Either way there is nothing to push.
            echo "manifests already at $NEXT"
            exit 0
          fi
          git add -A
          git commit -q -m "chore: release $NEXT"
          git push origin "HEAD:$BRANCH"

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
          REASON: ${{ steps.version.outputs.reason }}
          REQUESTED: ${{ steps.version.outputs.requested }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          BRANCH: ${{ github.event.ref }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$BRANCH" --state open --json number \
            --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr view "$existing" --json url --jq '"PR already open: \(.url)"'
            exit 0
          fi

          # A branch cut from an already-stamped base has nothing to review, and
          # `gh pr create` refuses an empty diff outright. Not an error — the
          # version still resolved, and publishing reads the tag list, not a PR.
          if [ "$(git rev-list --count "origin/$BASE..HEAD")" -eq 0 ]; then
            echo "::notice::$BRANCH is level with $BASE (already stamped $NEXT) — no PR to open"
            exit 0
          fi

          note="\`$REQUESTED\` is free — no tag holds it yet"
          if [ "$REASON" = "auto-bumped" ]; then
            note="\`$REQUESTED\` is **already the latest tag**, so the patch was bumped"
          fi

          # The delimiter sits at this block's own indentation, which YAML
          # strips, so it lands in column 0 of the script that actually runs.
          cat > /tmp/release-pr-body.md <<EOF
          Release **$NEXT**, cut from \`$BRANCH\`.

          | | |
          |---|---|
          | Previous tag | \`${PREVIOUS:-none}\` |
          | This release | \`$NEXT\` |
          | Decided by | \`$REASON\` — $note |

          The version is stamped into \`.claude-plugin/plugin.json\`, \`Cargo.toml\`
          and \`Cargo.lock\` by the commit on this branch. Nothing has been tagged
          and nothing has been published.

          **To publish**, once this has merged:

          \`\`\`sh
          gh workflow run release.yml --ref $BASE -f version=$NEXT
          \`\`\`

          That run repeats the suite and the e2e check, tags \`$NEXT\`, creates
          the GitHub release, then builds the TUI, desktop and iOS clients from
          that tag and attaches them to it. It is the only step visible outside
          this repo, which is why it is never automatic.
          EOF

          # The version is resolved, stamped and pushed by now; the PR is how it
          # gets reviewed, not how it gets published. So a repo with "Allow
          # GitHub Actions to create and approve pull requests" switched off
          # (the default) gets told exactly what to run, rather than a red X on
          # a branch that is in fact correctly prepared.
          if ! gh pr create --draft --base "$BASE" --head "$BRANCH" \
            --title "release: $NEXT" --body-file /tmp/release-pr-body.md; then
            echo "::warning::could not open the PR — check Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests'. The branch is prepared; open it by hand:"
            {
              echo "### PR not opened"
              echo
              echo "\`$BRANCH\` is prepared and pushed at \`$NEXT\`. Open the PR with:"
              echo
              echo '```sh'
              echo "gh pr create --draft --base $BASE --head $BRANCH --title 'release: $NEXT'"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summarise
        env:
          NEXT: ${{ steps.version.outputs.next }}
          REASON: ${{ steps.version.outputs.reason }}
          REQUESTED: ${{ steps.version.outputs.requested }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          {
            echo "## Prepared \`$NEXT\`"
            echo
            echo "Branch asked for \`$REQUESTED\`; resolved as \`$REASON\`."
            echo "Nothing is tagged yet. Publish with:"
            echo
            echo '```sh'
            echo "gh workflow run release.yml --ref $BASE -f version=$NEXT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- publish --
  publish:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' && !inputs.build_only
    needs: [test, e2e]
    runs-on: ubuntu-latest
    # Deliberate: an environment can carry required reviewers and a deployment
    # log. Referencing one with no protection rules costs nothing today and
    # means requiring an approval later is a repo setting, not a code change.
    environment: release
    outputs:
      # What every build job below checks out. Empty on a build-only run, which
      # is how those jobs know to fall back to the dispatched ref.
      tag: ${{ steps.version.outputs.next }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse to publish from an arbitrary branch
        env:
          REF: ${{ github.ref_name }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$REF" in
            "$BASE" | release/*) ;;
            *)
              echo "::error::refusing to tag from '$REF' — dispatch this from $BASE or a release/* branch"
              exit 1
              ;;
          esac

      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          source .github/scripts/release_version.sh

          # Precedence: what the dispatcher typed, then what the branch is
          # named, then a bump of the latest tag.
          requested="${INPUT_VERSION:-}"
          if [ -z "$requested" ]; then
            requested="$(branch_version "$REF")" || requested=""
          fi

          resolved="$(git tag --list 'v*' | resolve_release_version "$requested" "$BUMP")" || {
            echo "::error::cannot publish '${requested:-a $BUMP bump}' from '$REF' — see the refusal above"
            exit 1
          }
          read -r next reason <<<"$resolved"
          latest="$(git tag --list 'v*' | highest_semver_tag)"

          # A typed version is an instruction, not a request. Publishing
          # something else because a tag moved underneath would be a surprise on
          # the one step that cannot be taken back.
          if [ -n "${INPUT_VERSION:-}" ] && [ "$next" != "v${INPUT_VERSION#v}" ]; then
            echo "::error::asked to publish $INPUT_VERSION but it resolves to $next ($reason) — re-dispatch deliberately"
            exit 1
          fi

          {
            echo "next=$next"
            echo "reason=$reason"
            echo "previous=${latest:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Tag and push
        env:
          NEXT: ${{ steps.version.outputs.next }}
          REASON: ${{ steps.version.outputs.reason }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null; then
            echo "::error::tag $NEXT already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Usually a no-op: prepare already stamped these on the release branch
          # and the PR carried them in. It matters on the other path — a dispatch
          # straight from the default branch — where the tagged commit would
          # otherwise claim the previous version. Committed onto the tag only,
          # never pushed to a branch: tags are this repo's source of truth for
          # versions, so the released artifact carrying its own version needs no
          # write access to the default branch.
          .github/scripts/stamp_version.sh "$NEXT"
          if ! git diff --quiet; then
            git add -A
            git commit -q -m "chore: stamp the manifests $NEXT"
          fi

          git tag -a "$NEXT" -m "$NEXT ($REASON, from ${PREVIOUS:-no previous tag})"
          git push origin "$NEXT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          args=(--title "$NEXT" --generate-notes)
          # No previous tag on the very first release — --notes-start-tag would
          # reference a tag that doesn't exist.
          [ -n "$PREVIOUS" ] && args+=(--notes-start-tag "$PREVIOUS")
          gh release create "$NEXT" ${args[@]+"${args[@]}"}
          {
            echo "## Published \`$NEXT\`"
            echo
            gh release view "$NEXT" --json url --jq .url
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------- TUI --
  tui:
    name: TUI ${{ matrix.target }}
    # `publish` is skipped on a build-only run, and a skipped `needs` would take
    # this job down with it under the default rule. So: run unless the suite
    # failed or a publish that was actually attempted failed.
    if: >-
      !cancelled()
      && github.event_name == 'workflow_dispatch'
      && inputs.tui
      && needs.test.result == 'success'
      && needs.publish.result != 'failure'
    needs: [test, publish]
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others are fine.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled from the same Apple Silicon runner rather than taken
          # to a macos-13 Intel image: those images are on a deprecation path,
          # and nothing in these crates needs a native host to build for x86_64.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Free for public repositories, which this is. Covers an ARM VPS.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag this run just created. Empty only on a build-only run, which
          # publishes nothing and so builds the ref it was dispatched from.
          ref: ${{ needs.publish.outputs.tag || github.sha }}

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: Show the toolchain actually in use
        run: rustc -V && cargo -V

      # `--locked` deliberately: the lockfile is committed and stamped by the
      # publish job above, so a release binary is built from the dependency set
      # that was reviewed, not from whatever resolved on the day.
      #
      # No dependency cache. A release build runs a handful of times a month,
      # and a cache action is one more third-party thing in the path between a
      # tag and a binary people download.
      - name: Build the binaries
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p jod-cli -p jod-supervisor -p jod-api

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # No version in the filename, deliberately. It is what makes
          # `/releases/latest/download/jod-<target>.tar.gz` a URL the README can
          # print once and never revise. The binary answers `--version` itself,
          # so nothing is lost.
          name="jod-$TARGET"
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out"

          bin="target/$TARGET/release"
          for b in jod jod-run jod-api; do
            test -x "$bin/$b" || { echo "::error::$bin/$b missing or not executable"; exit 1; }
          done

          # -C so the tarball holds three bare binaries, not target/…/release/…
          tar -czf "$out/$name.tar.gz" -C "$bin" jod jod-run jod-api

          # Run the binary before archiving it, while the path is still simple —
          # and let it fail loudly only where it *should* run. A row whose
          # target is not this host's is cross-built and cannot be executed
          # here; that is expected, not a defect.
          echo "version-check:"
          "$bin/jod" --version || echo "(cross-built for $TARGET — not runnable on this host)"

          cd "$out"
          # sha256sum on Linux, shasum on macOS — neither host has both. The
          # checksum names the file relative to itself, so `sha256sum -c` works
          # in whatever directory the user downloaded it to.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"

      # `release-` prefix on purpose: the attach job downloads by that pattern,
      # so a diagnostic artifact can never be mistaken for a release asset.
      - uses: actions/upload-artifact@v4
        with:
          name: release-tui-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  # --------------------------------------------------------------- Desktop --
  desktop:
    name: Desktop ${{ matrix.name }}
    if: >-
      !cancelled()
      && github.event_name == 'workflow_dispatch'
      && inputs.desktop
      && needs.test.result == 'success'
      && needs.publish.result != 'failure'
    needs: [test, publish]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One .dmg that runs on both Apple architectures, rather than two the
          # user has to choose between.
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
          - name: linux-x86_64
            os: ubuntu-latest
            target: ""
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.tag || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Tauri v2's Linux dependency set: webkit2gtk-4.1 (not 4.0, which is v1),
      # and libayatana rather than libappindicator3 — the two conflict.
      - name: Install the Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      # A universal binary is two real builds stitched together; cargo needs
      # both targets present or `tauri build` fails partway through the second.
      - name: Add the macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: Build the bundles
        working-directory: apps/desktop
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          # `tauri build` runs `npm run build` itself via beforeBuildCommand —
          # the frontend is not built separately here.
          args=(--bundles "$BUNDLES")
          # Empty on the Linux row, which builds for the host. Spelled as an
          # `if` rather than `[ -n "$TARGET" ] && args+=(…)` so it stays correct
          # if it ever ends up last in a script under `set -e`, where an
          # AND-list that fails its test does set a non-zero exit status.
          if [ -n "$TARGET" ]; then
            args+=(--target "$TARGET")
          fi
          npx tauri build "${args[@]}"

      - name: Collect the bundles
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out"

          # src-tauri is its own cargo workspace, so its target/ is local to the
          # app. Cargo inserts the triple as a path segment only when one was
          # asked for — hence the two shapes. Pinned rather than searched: a
          # tree that has been built twice holds a bundle per target, and a
          # search would happily label the wrong one.
          root="apps/desktop/src-tauri/target"
          if [ -n "$TARGET" ]; then
            bundle="$root/$TARGET/release/bundle"
          else
            bundle="$root/release/bundle"
          fi
          test -d "$bundle" || {
            echo "::error::no bundle directory at $bundle"
            find "$root" -maxdepth 3 -type d -name bundle -print
            exit 1
          }

          found=0
          while IFS= read -r -d '' f; do
            found=1
            base="$(basename "$f")"
            ext="${base##*.}"
            cp "$f" "$out/jod-desktop-$NAME.$ext"
            echo "collected: $base -> jod-desktop-$NAME.$ext"
          done < <(find "$bundle" -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0)

          if [ "$found" -eq 0 ]; then
            echo "::error::tauri produced no installable bundle under $bundle"
            find "$bundle" -maxdepth 2 | head -50
            exit 1
          fi

          cd "$out"
          for f in *; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.name }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------- iOS --
  # Called, not copied. `ios.yml` already owns compiling the shell for iOS,
  # bundling it and proving it launches in a simulator; duplicating that here
  # would give this repo two versions of a long, fiddly macOS build to keep in
  # step. Given `package: true` it also zips the .app with `ditto` and uploads
  # it as `release-ios`, which is what the attach job below collects.
  ios:
    name: iOS
    if: >-
      !cancelled()
      && github.event_name == 'workflow_dispatch'
      && inputs.ios
      && needs.test.result == 'success'
      && needs.publish.result != 'failure'
    needs: [test, publish]
    uses: ./.github/workflows/ios.yml
    with:
      ref: ${{ needs.publish.outputs.tag || github.sha }}
      package: true

  # ----------------------------------------------------------------- attach --
  attach:
    name: Attach the assets to the release
    needs: [publish, tui, desktop, ios]
    # A client switched off leaves its job 'skipped', which would skip this one
    # too under the default rule. So: run unless something the user actually
    # asked for failed, and upload whatever did get built. `publish` having
    # succeeded is the non-negotiable part — it is what proves a tag exists, and
    # it is exactly what a build-only run does not have.
    if: >-
      !cancelled()
      && needs.publish.result == 'success'
      && needs.tui.result != 'failure'
      && needs.desktop.result != 'failure'
      && needs.ios.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@v4
        with:
          path: incoming
          # Only the release-shaped artifacts. Without this it would also pull
          # `ios-simulator` — a screenshot and an unpacked .app tree, hundreds of
          # files that would each become a release asset.
          pattern: release-*

      - name: Flatten
        run: |
          set -euo pipefail
          mkdir -p dist
          # Artifacts arrive one directory per job; the release wants a flat
          # list of files. Names are unique by construction (target or platform
          # is in each one), so -n never has to arbitrate.
          find incoming -type f -exec cp -n {} dist/ \;
          ls -la dist
          test -n "$(ls -A dist)"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          # The tag and its release page were both created by `publish`, which
          # this job requires to have succeeded — so there is nothing to create
          # here and no case where a missing release means "make one". Creating
          # a tag is a version decision and it happens in exactly one job.
          gh release upload "$TAG" dist/* --clobber

          {
            echo "## Assets attached to \`$TAG\`"
            echo
            echo '| File | Size |'
            echo '|---|---|'
            for f in dist/*; do
              [ -f "$f" ] || continue
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
            echo
            gh release view "$TAG" --json url --jq .url
          } >> "$GITHUB_STEP_SUMMARY"

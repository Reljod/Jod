name: Rust

# The Rust half of the repo had no gate at all: tests.yml discovers shell
# suites (`*.test.sh`), so `cargo test` never ran on a PR and the crates' tests
# could rot unnoticed. This runs the whole workspace's tests, and holds `core`
# to a line-coverage floor.
#
# The floor is a hard failure rather than a report. A coverage number nobody
# blocks on is a number that only ever goes down.
#
# Why the floor is on `core` alone, not --workspace: `core` is at 97% and can
# hold 95 today. `cli` and `api` cannot — at the time of writing cli/src/main.rs
# is at 9%, cli/src/tui/mod.rs at 0% and api/src/routes.rs at 73%, so a
# workspace-wide floor would fail every PR on day one and be switched off within
# the week. Their numbers print on every run so the gap stays visible; add each
# to the gated step as it gets there.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  COVERAGE_FLOOR: 95
  # Terminal lifecycle only: raw mode, the alternate screen and the panic hook.
  # It acts on the real controlling TTY, so a test that succeeded there would
  # put the developer's own shell into raw mode with no echo — the very failure
  # the module exists to prevent — and a faked one would assert nothing. Kept to
  # ~20 lines and verified by running `jod tui`. Everything it wraps lives in
  # `event_loop`, which is generic over the backend so it can be driven headless.
  UNTESTABLE: 'tui/terminal\.rs'

jobs:
  test:
    name: workspace tests + core coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      # tmux is not needed: the tests drive a fake tmux binary via JOD_TMUX_BIN
      # (core/src/testsupport.rs) so they never depend on — or disturb — a real
      # tmux server.
      - name: Test the whole workspace
        run: cargo test --workspace

      - name: Hold core to the coverage floor
        run: |
          cargo llvm-cov -p jod-core \
            --fail-under-lines "$COVERAGE_FLOOR" \
            --summary-only

      # The TUI is gated as its own unit: cli as a whole cannot hold 95 yet
      # (main.rs's async dispatch is at 29%), but cli/src/tui is at 97-99% and
      # would silently rot if nothing held it there.
      - name: Hold the TUI to the coverage floor
        run: |
          cargo llvm-cov -p jod-cli \
            --ignore-filename-regex "$UNTESTABLE" \
            --summary-only --json --output-path /tmp/cli-cov.json
          python3 - <<'PY'
          import json, sys
          floor = 95.0
          data = json.load(open("/tmp/cli-cov.json"))
          files = data["data"][0]["files"]
          tui = [f for f in files if "/tui/" in f["filename"]]
          if not tui:
              sys.exit("no cli/src/tui files were measured — did the path move?")
          covered = sum(f["summary"]["lines"]["covered"] for f in tui)
          total = sum(f["summary"]["lines"]["count"] for f in tui)
          pct = 100.0 * covered / total
          for f in sorted(tui, key=lambda f: f["filename"]):
              s = f["summary"]["lines"]
              print(f"  {f['filename'].split('/')[-1]:<10} {s['percent']:.2f}%")
          print(f"  {'TUI':<10} {pct:.2f}% (floor {floor}%)")
          if pct < floor:
              sys.exit(f"TUI coverage {pct:.2f}% is below the {floor}% floor")
          PY

      - name: Report coverage for every crate
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Coverage"
            echo
            echo "\`core\` is gated at ${COVERAGE_FLOOR}% lines. Everything else is"
            echo "reported only — see the note in .github/workflows/rust.yml."
            echo
            echo '```'
            cargo llvm-cov --workspace --summary-only 2>/dev/null | tail -n 30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
